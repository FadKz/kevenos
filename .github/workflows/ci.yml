name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: agent-requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install --requirement agent-requirements.txt
      - name: Run Python tests
        run: PYTHONPATH=.:tests python -m unittest discover -s tests -p 'test_*.py'
      - name: Install Node dependencies
        run: npm ci
      - name: Install live-display dependencies
        run: npm ci --prefix live-display
      - name: Type-check live-display sources
        run: npm run typecheck --prefix live-display
      - name: Build live-display bundles
        run: npm run build --prefix live-display
      - name: Verify committed live-display bundles
        run: git diff --exit-code -- static/live-player.js static/participant-prep-player.js static/event-quiz.js
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Run browser-unit tests
        run: npm test
      - name: Audit Node dependencies
        run: npm audit --audit-level=high
      - name: Audit live-display dependencies
        run: npm audit --prefix live-display --audit-level=high
      - name: Verify public-package sanitization
        run: ./tools/verify-sanitized.sh
      - name: Validate release metadata
        run: python tools/release.py validate

  container:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: kevenos:${{ github.sha }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application
      - name: Build website image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.website
          push: false
          tags: kevenos-site:${{ github.sha }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website

  release-candidate:
    name: Prepare release candidate
    needs: [test, container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Build deterministic release artifacts
        run: python tools/release.py build --output dist
      - name: Upload qualified release candidate
        uses: actions/upload-artifact@v7
        with:
          name: kevenos-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
