name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: agent-requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install --requirement agent-requirements.txt
      - name: Run Python tests
        run: PYTHONPATH=.:tests python -m unittest discover -s tests -p 'test_*.py'
      - name: Qualify shared PostgreSQL backend
        env:
          KEVENOS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          KEVENOS_TEST_SCHEMA_PREFIX: kevenos_ci
        run: python tools/qualify_postgres.py
      - name: Test engagement concurrency on PostgreSQL
        env:
          KEVENOS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: PYTHONPATH=.:tests python -m unittest test_engagement_postgres
      - name: Install Node dependencies
        run: npm ci
      - name: Install live-display dependencies
        run: npm ci --prefix live-display
      - name: Type-check live-display sources
        run: npm run typecheck --prefix live-display
      - name: Build live-display bundles
        run: npm run build --prefix live-display
      - name: Verify committed live-display bundles
        run: git diff --exit-code -- static/live-player.js static/participant-prep-player.js static/event-quiz.js
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Run browser-unit tests
        run: npm test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Run engagement browser rehearsals
        run: |
          KEVENOS_TEST_BROWSER=webkit node tests/test_engagement_rehearsal.cjs
          KEVENOS_TEST_BROWSER=chromium node tests/test_engagement_rehearsal.cjs
      - name: Audit Node dependencies
        run: npm audit --audit-level=high
      - name: Audit live-display dependencies
        run: npm audit --prefix live-display --audit-level=high
      - name: Verify public-package sanitization
        run: ./tools/verify-sanitized.sh
      - name: Validate release metadata
        run: python tools/release.py validate

  container:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: kevenos:${{ github.sha }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application
      - name: Build disposable Vercel demo image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.vercel
          push: false
          load: true
          tags: kevenos-demo:${{ github.sha }}
          cache-from: type=gha,scope=vercel-demo
          cache-to: type=gha,mode=max,scope=vercel-demo
      - name: Smoke disposable Vercel demo image
        run: ./tools/smoke-vercel-container.sh kevenos-demo:${{ github.sha }}
      - name: Build website image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.website
          push: false
          tags: kevenos-site:${{ github.sha }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website

  release-candidate:
    name: Prepare release candidate
    needs: [test, container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Build deterministic release artifacts
        run: python tools/release.py build --output dist
      - name: Upload qualified release candidate
        uses: actions/upload-artifact@v7
        with:
          name: kevenos-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
