<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Event Desk | KevenOS</title>
<link href="/static/app.css" rel="stylesheet"/>
<link href="/static/assistant.css" rel="stylesheet"/>
<link href="/static/event-quiz.css" rel="stylesheet"/>
<link href="/static/audience-questions.css" rel="stylesheet"/>
<link href="/static/judging-operations.css" rel="stylesheet"/>
<link href="/static/role-home.css" rel="stylesheet"/><link href="/static/event-operations.css" rel="stylesheet"/></head>
<body class="role-home-page">
<main class="login" hidden="" id="login">
<h1>Event Desk</h1>
<div class="card">
<p hidden="" id="access-help">The Organizer runs live judging. Sign in with your Organizer or Admin password.</p>
<p id="err" role="alert"></p>
<a class="btn" hidden="" href="/?access=desk" id="signin">Organizer sign-in</a>
<form hidden="" id="local-login" method="post">
<label for="pin">Organiser PIN</label>
<input autocomplete="off" id="pin" inputmode="numeric" required="" type="password"/>
<p><button class="btn" type="submit">Open Desk</button></p>
</form>
</div>
</main>
<div class="workspace desk-workspace" hidden="" id="app">
<header class="desk-top">
<div class="desk-top-inner">
<p class="ops-nav-title" hidden id="ops-nav-title">Event Operations</p>
<nav aria-label="Desk sections" class="workspace-nav" id="nav"></nav>
<div class="desk-links row">
<button class="btn ghost sm" data-nav-help="" id="desk-help" type="button">Desk guide</button>
<button class="btn ghost sm" data-nav-signout="" hidden="" id="desk-out" type="button">Sign out</button>
</div>
</div>
</header>
<div class="desk-clock" hidden="" id="head">
<div class="desk-clock-inner row">
<span class="pill" id="hr"></span>
<span class="small mut" id="hph"></span><span class="tt" id="htt">--:--</span>
<button class="btn sm" id="cstart">Start</button><button class="btn alt sm" id="cpause">Pause</button>
<button class="btn alt sm" hidden="" id="cfinish">Finish pitch · collect sheets</button><button class="btn ghost sm" id="creset">Reset round clock</button>
<div class="grow"></div><span class="small" id="connection" role="status"></span>
<button class="btn ghost sm" id="cmode" title="Switch between judge-paced sessions and one shared Desk clock"></button>
</div>
</div>
<main class="workspace-page">
<header class="page-heading"><h1 id="heading" tabindex="-1"></h1><p id="description"></p></header>
<p id="desk-status" role="alert"></p>
<p id="ops-connection" class="ops-connection" role="status" hidden></p>
<nav id="scoring-subnav" class="ops-subnav" aria-label="Scoring tools" hidden></nav>
<div id="main"></div>
<div hidden="" id="desk-documents"></div>
</main>
<dialog aria-labelledby="sheet-title" id="modal"><div id="mbody"></div></dialog>
</div>
<script src="/static/common.js"></script>
<script src="/static/event-operations.js"></script>
<script src="/static/event-quiz.js"></script>
<script src="/static/audience-questions.js"></script>
<script src="/static/assistant.js"></script>
<script src="/static/participant-desk.js"></script>
<script>
const $ = id => document.getElementById(id);
const get = path => KEV.api(path, null, KEV.staff.token);
const post = (path, body = {}) => KEV.api(path, {body}, KEV.staff.token);
const TABS = {
  home: ['Today', 'Your event control centre. Check the room, then choose the next action.'],
  run: ['Run', 'Station timers, assignments and incoming score sheets.'],
  scores: ['Scores', 'Review submitted sheets, scoring flags and the event debrief.'],
  quiz: ['Quiz', 'Run the optional attendee quiz and control what appears on the hall screen.'],
  audience: ['Audience questions', 'Create and send optional questions and share results with attendees.'],
  participants: ['Participants', 'Post updates, release team feedback and review customer nominations.'],
  display: ['Live View', 'Control the audience screen and check what it shows before sharing.'],
  final: ['Final', 'Select finalists and manage the stage order.'],
  calib: ['Calibration', 'Run the mock pitch and compare judge scores against the answer key.']
};
const dashboard = location.pathname === '/organizer' ? 'organizer' : location.pathname === '/scoring' ? 'scoring' : 'desk';
const PARTICIPANT_VIEWS = {
  compose: ['Send a message', 'messages', 'messages'],
  updates: ['Event feed', 'participants', 'messages'],
  delivery: ['Delivery', 'participant-delivery', 'messages'],
  help: ['Help inbox', 'participant-help', 'attendees'],
  nominations: ['Nominations', 'participant-nominations', 'attendees']
};
if (dashboard === 'organizer') {
  for (const key of ['run','scores','final','calib']) delete TABS[key];
  $('app').dataset.workspace = 'organizer';
  $('ops-nav-title').hidden = false;
  TABS.home=['Today','See the programme, room screen and venue readiness at a glance.'];
  TABS.display=['Run of show','Move through cues and check what the room is seeing.'];
  TABS.quiz=['Quiz','Prepare questions, run the scored quiz and review results.'];
  TABS.audience=['Audience questions','Send unscored polls and feedback questions.'];
  delete TABS.participants;
  TABS.messages=['Messages','Choose where your message should appear and check delivery.'];
  TABS.attendees=['Attendee support','Answer private help requests and manage customer nominations.'];
}
const scoringNav = ['home','run','scores','final'];
if (dashboard === 'scoring') {
  for (const key of ['quiz','display','audience']) delete TABS[key];
  $('app').dataset.workspace = 'scoring';
  $('ops-nav-title').hidden = false;
  $('ops-nav-title').textContent = 'Judging Operations';
  const tools = document.createElement('details');
  tools.className = 'judging-clock-tools';
  tools.innerHTML = '<summary>Clock settings</summary><div class="row"></div>';
  $('cmode').after(tools);
  tools.querySelector('div').append($('creset'), $('cmode'));
  TABS.home = ['Today', 'Check stations and practice scoring before the first team.'];
  TABS.run = ['Stations', 'Run the round, collect sheets and help stations that need attention.'];
  TABS.scores = ['Scores & Feedback', 'Review scores or release judge-approved feedback to teams.'];
  TABS.participants = ['Feedback release', 'Review approved comments and choose which teams receive them.'];
}
let tab = 'home', quizEditor = false, participantView = 'updates', C, DS, SC, calib, recv = 0, sequence = 0, active = false;
let lastSig = '', summary = '', finalistDraft = null;
let syncInFlight = false;

function login(message, switching = false) {
  KEV.assistant?.unmount();
  active = false;
  syncInFlight = false;
  sequence++;
  $('app').hidden = true;
  $('desk-out').hidden = true;
  KEV.nav.render();
  KEV.closeHelp();
  $('head').hidden = true;
  DS = SC = calib = C = null;
  summary = '';
  finalistDraft = null;
  if ($('modal').open) $('modal').close();
  $('main').replaceChildren();
  window.ParticipantDesk?.clear();
  window.EventQuiz?.clear();
  window.AudienceQuestions?.clear();
  $('desk-documents').replaceChildren();
  $('err').textContent = message;
  $('access-help').hidden = !KEV.staff.hosted;
  $('signin').textContent = switching ? 'Switch profile' : 'Organizer sign-in';
  $('signin').hidden = !KEV.staff.hosted;
  $('local-login').hidden = KEV.staff.hosted;
  $('login').hidden = false;
}

async function start() {
  try {
    const session = await KEV.staff.session();
    if (!session.authenticated) return login('');
    if (KEV.staff.hosted && location.pathname === '/desk') {
      const key = location.hash.slice(1), target = ['run','scores','final','calib'].includes(key) ? 'scoring' : ['display','quiz','quiz-editor','audience','attendees',...Object.values(PARTICIPANT_VIEWS).map(([,anchor])=>anchor)].includes(key) ? 'organizer' : null;
      const allowed = (session.dashboards || []).some(item => item.id === target || item.role === target);
      location.replace(target && allowed ? '/' + target + location.hash : '/home');
      return;
    }
    if (!['admin', 'desk'].includes(session.role)) return login('This account does not have Desk access.', true);
    C = await get('/api/content');
    $('desk-out').hidden = KEV.staff.hosted;
    if (KEV.staff.hosted) {
      await KEV.profile.mount({onEnd:message=>login(message)});
      const readOnlyControls = dashboard === 'organizer' ?
        ':not([data-home-tab], [data-participant-view], [data-pack-filter], [role="tab"], #present-toggle, #open-room-message)' : '';
      KEV.profile.previewControls($('app'),'.workspace-page button:not([data-resource])'+readOnlyControls+
        ', .workspace-page input:not([type="search"]), .workspace-page select, .workspace-page textarea, .desk-clock button');
    }
    $('login').hidden = true;
    $('app').hidden = false;
    KEV.nav.render();
    active = true;
    KEV.assistant?.mount($('app'), session.role, () => refresh(true));
    select(location.hash.slice(1), false);
    if (KEV.staff.hosted) loadDocuments();
  } catch (e) {
    if (!KEV.staff.hosted && e.status === 401) await KEV.staff.signOut();
    login(e.message);
  }
}

$('local-login').onsubmit = async e => {
  e.preventDefault();
  try {
    await KEV.staff.localLogin($('pin').value.trim());
    $('pin').value = '';
    await start();
  } catch (error) { $('err').textContent = error.message; }
};
$('desk-out').onclick = async () => {
  try {
    await KEV.staff.signOut();
    login('Signed out of the Event Desk.');
  } catch (e) { $('desk-status').textContent = e.message; }
};
KEV.bindHelp($('desk-help'), () => KEV.staff.token, '/api/help?context=desk');

const organizerNav = [
  ['Event day', [['home','Current cue & readiness'],['display','Programme & projector'],['messages','Announcements & delivery']]],
  ['Engagement', [['quiz','Scored questions'],['audience','Polls & feedback']]],
  ['Participants', [['attendees','Help & nominations']]]
];
$('nav').innerHTML = dashboard === 'organizer'
  ? organizerNav.map(([group, items]) => '<div class="ops-nav-group"><p>'+group+'</p>'+
    items.map(([key, hint]) => '<button type="button" data-t="'+key+'"><strong>'+TABS[key][0]+
      '</strong><small aria-hidden="true">'+hint+'</small></button>').join('')+'</div>').join('')
  : Object.entries(TABS).filter(([key]) => dashboard !== 'scoring' || scoringNav.includes(key)).map(([key, [label]]) => '<button type="button" data-t="'+key+'">'+label+'</button>').join('');
$('nav').addEventListener('click', e => {
  const button = e.target.closest('[data-t]');
  if (button) select(button.dataset.t, true);
});
window.addEventListener('hashchange', () => { if (active) select(location.hash.slice(1), false); });

function select(key, focus) {
  const participantDestination = dashboard === 'organizer' &&
    (key === 'attendees' ? 'help' : Object.keys(PARTICIPANT_VIEWS).find(view => PARTICIPANT_VIEWS[view][1] === key));
  const participantSection = participantDestination && PARTICIPANT_VIEWS[participantDestination][2];
  if (participantSection && tab === participantSection && $('participant-tools')) {
    showParticipantView(participantDestination, focus);
    return;
  }
  window.ParticipantDesk?.clear();
  window.EventQuiz?.clear();
  window.AudienceQuestions?.clear();
  KEV.operations?.clear?.();
  quizEditor = key === 'quiz-editor' && Object.hasOwn(TABS, 'quiz');
  participantView = participantDestination || 'updates';
  tab = quizEditor ? 'quiz' : participantSection || (Object.hasOwn(TABS, key) ? key : 'home');
  const anchor = quizEditor ? 'quiz-editor' : participantDestination ? PARTICIPANT_VIEWS[participantDestination][1] : tab;
  if (focus && location.hash !== '#' + anchor) history.replaceState(null, '', '#' + anchor);
  $('heading').textContent = TABS[tab][0];
  $('description').textContent = TABS[tab][1];
  for (const b of $('nav').querySelectorAll('button')) {
    const selected = b.dataset.t === tab || (dashboard === 'scoring' &&
      ((tab === 'participants' && b.dataset.t === 'scores') || (tab === 'calib' && b.dataset.t === 'home')));
    b.classList.toggle('on', selected);
    if (selected) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  }
  const subnav = $('scoring-subnav');
  subnav.hidden = dashboard !== 'scoring' || !['scores','participants','calib'].includes(tab);
  subnav.replaceChildren();
  if (!subnav.hidden) {
    const items = tab === 'calib' ? [['home','Readiness'],['calib','Calibration']] :
      [['scores','Score review'],['participants','Feedback release']];
    for (const [key, label] of items) {
      const button = document.createElement('button');
      button.className = 'btn ghost';
      button.textContent = label;
      button.setAttribute('aria-pressed', String(tab === key));
      button.onclick = () => select(key, true);
      subnav.append(button);
    }
  }
  $('desk-status').textContent = '';
  $('desk-documents').hidden = tab !== 'run' || !$('desk-documents').children.length;
  $('main').replaceChildren();
  $('main').dataset.section = tab;
  lastSig = '';
  if (focus) {
    $('heading').focus({preventScroll: dashboard !== 'organizer'});
    if (KEV.staff.hosted && !KEV.profile.isPreview) post('/api/activity', {action: 'navigation', page: '/desk', section: tab}).catch(() => {});
  }
  if (DS) draw(true);
  refresh(true);
}

async function loadDocuments() {
  try {
    const {resources} = await get('/api/event');
    if (!active || !resources?.length) return;
    $('desk-documents').innerHTML = '<details class="card"><summary><b>Desk documents</b></summary><ul>' +
      resources.map(file => '<li><button type="button" class="btn ghost sm" data-resource="' + KEV.esc(file.id) + '">' + KEV.esc(file.title) + '</button></li>').join('') + '</ul></details>';
    $('desk-documents').hidden = tab !== 'run';
  } catch {
    // The Desk clock and score workflows remain available when documents fail to load.
  }
}

async function refresh(force = false) {
  if (!active || (syncInFlight && !force)) return false;
  const request = ++sequence;
  const section = tab;
  syncInFlight = true;
  try {
    const [state, scores, calibration, participants] = await Promise.all([
      get('/api/desk/state'),
      ['scores', 'final'].includes(section) ? get('/api/desk/scores') : null,
      section === 'calib' ? get('/api/desk/calib') : null,
      ['participants','messages','attendees'].includes(section) ? get('/api/desk/participant-workspace') : null
    ]);
    if (request !== sequence || !active) return false;
    if (!DS) $('desk-status').textContent = '';
    DS = state;
    recv = Date.now();
    if (scores) SC = scores;
    if (calibration) calib = calibration;
    $('connection').textContent = '';
    $('ops-connection').hidden = true;
    draw(force);
    if (participants) window.ParticipantDesk?.render(dashboard === 'organizer' ? $('participant-tools') : $('main'), participants, force);
    return true;
  } catch (e) {
    if (request !== sequence || !active) return false;
    if (e.status === 401 || e.status === 403) {
      if (!KEV.staff.hosted) await KEV.staff.signOut();
      login('Your session ended. Sign in again.');
    } else {
      $('connection').textContent = 'Desk disconnected. Reconnecting…';
      if (dashboard === 'organizer') {
        $('ops-connection').textContent = 'Connection interrupted. Showing the last update while the Desk reconnects.';
        $('ops-connection').hidden = false;
      }
      if (!DS) $('desk-status').textContent = e.message;
    }
    return false;
  } finally {
    if (request === sequence) syncInFlight = false;
  }
}

async function act(path, body, button, done) {
  if(KEV.profile.isPreview){$('desk-status').textContent='Preview is read-only. Return to Admin to make changes.';return;}
  $('desk-status').textContent = '';
  if (button) button.disabled = true;
  try {
    const result = await post('/api/desk/' + path, body);
    if (done) done(result);
    await refresh(true);
  } catch (e) {
    if (e.code === 'preliminary_sheets_missing' && e.details?.review_token && !body.review_token) {
      showPreliminaryException(path, body, e.details, done);
      return;
    }
    const status = $('modal').open ? ($('sheet-status') || $('desk-status')) : $('desk-status');
    status.textContent = e.message;
    if ([401,403,409].includes(e.status) && !$('modal').open) await refresh(true);
  } finally {
    if (button) button.disabled = false;
  }
}

function showPreliminaryException(path, body, review, done) {
  const dialog = $('modal');
  const byRound = new Map();
  for (const row of review.missing) {
    if (!byRound.has(row.round)) byRound.set(row.round, []);
    byRound.get(row.round).push('Station ' + row.station + ' · Team ' + row.pair);
  }
  $('mbody').innerHTML = '<form id="prelim-exception"><h2 id="sheet-title">Outstanding score sheets</h2>' +
    '<p class="mut">Wait for these sheets, or record why the event needs to continue. An exception does not create a score.</p>' +
    '<ul class="judging-exception-list">' + [...byRound].map(([round, teams]) =>
      '<li><strong>Round ' + round + '</strong>: ' + KEV.esc(teams.join(', ')) + '</li>').join('') + '</ul>' +
    '<label class="field">Reason to continue<textarea id="prelim-reason" minlength="8" maxlength="500" required></textarea></label>' +
    '<p id="sheet-status" role="alert"></p><div class="row"><button type="button" class="btn ghost" id="prelim-cancel">Keep waiting</button>' +
    '<button type="submit" class="btn bad" id="prelim-continue">Record exception and continue</button></div></form>';
  dialog.showModal();
  $('prelim-cancel').focus();
  $('prelim-cancel').onclick = () => dialog.close();
  $('prelim-exception').onsubmit = e => {
    e.preventDefault();
    act(path, {...body, override_reason:$('prelim-reason').value.trim(), review_token:review.review_token},
      $('prelim-continue'), result => { dialog.close(); done?.(result); });
  };
}
function currentClock(action) {
  return DS?.clock.kind === 'round' ? {action, expected_round:DS.clock.round} : {action};
}

$('cstart').onclick = e => act('clock', currentClock('start'), e.currentTarget);
$('cpause').onclick = e => act('clock', currentClock('pause'), e.currentTarget);
$('cfinish').onclick = e => { if (confirm('Finish this finalist’s pitch and ask the panel to submit their sheets?')) act('clock', {action: 'finish'}, e.currentTarget); };
$('cmode').onclick = e => {
  const to = DS.mode === 'self' ? 'desk' : 'self';
  const question = to === 'desk' ? 'Switch aligned, paused stations to one shared clock?' : 'Switch to independent station clocks? The shared clock must be paused.';
  if (confirm(question)) act('mode', {mode: to}, e.currentTarget);
};
$('creset').onclick = e => {
  if (confirm(DS.clock.kind === 'final' ? 'Reset the finalist’s clock to 8:00?' : 'Reset the round clock to 0:00?')) act('clock', currentClock('reset'), e.currentTarget);
};

function el() {
  return DS ? DS.clock.elapsed + (DS.clock.running ? (Date.now() - recv) / 1000 : 0) : 0;
}
function tickClock() {
  if (!active || !DS) return;
  if (DS.mode === 'self') document.querySelectorAll('[data-sc]').forEach(n => {
    const station = DS.stations.find(s => s.station === +n.dataset.sc);
    if (station) n.textContent = stxt(station);
  });
  const c = DS.clock;
  if (c.kind === 'final') {
    const final = KEV.finalClock(c, (Date.now() - recv) / 1000);
    $('htt').textContent = final.time;
    $('hph').textContent = ['review','completed'].includes(KEV.finalStatus(DS.final)) ? KEV.finalLabel(DS.final) : final.label;
    return;
  }
  const phase = sphase(c), idle = !c.started_any && !c.running;
  $('htt').textContent = idle ? '--:--' : phase.txt;
  $('hph').textContent = idle ? 'Clock not started' : (c.running ? '' : 'Paused · ') + phase.ph;
}

function draw(force) {
  if (!DS) return;
  const final = DS.clock.kind === 'final', self = DS.mode === 'self' && !final;
  $('head').hidden = dashboard === 'organizer' || (dashboard === 'scoring' && !['run','final'].includes(tab));
  $('hr').textContent = final ? 'Stage final' : self ? 'Judge-paced' : 'Round ' + DS.clock.round;
  $('creset').textContent = final ? 'Reset final clock' : 'Reset round clock';
  $('cstart').textContent = final ? 'Start final clock' : 'Start';
  $('cmode').hidden = final;
  if ($('cmode').closest('.judging-clock-tools')) $('cmode').closest('.judging-clock-tools').hidden =
    final && ['review','completed'].includes(KEV.finalStatus(DS.final));
  $('cmode').textContent = self ? 'Switch to Desk clock' : 'Switch to judge-paced';
  $('htt').hidden = $('hph').hidden = $('creset').hidden = self;
  $('cstart').hidden = self || DS.clock.running || (final && DS.clock.ended);
  $('cpause').hidden = self || !DS.clock.running;
  $('cfinish').hidden = !final || KEV.finalStatus(DS.final) !== 'pitch';
  if (final && ['review','completed'].includes(KEV.finalStatus(DS.final))) { $('cstart').hidden = $('cpause').hidden = $('creset').hidden = $('htt').hidden = true; }
  KEV.stamp(DS.versions);
  tickClock();
  if (tab === 'home') { $('head').hidden=true; vHome(); return; }
  if (tab === 'display') {
    if (!$('present-frame')) vDisplay();
    updateDisplay();
    return;
  }
  if (tab === 'quiz') {
    window.EventQuiz?.desk($('main'), get, post, quizEditor);
    return;
  }
  if (tab === 'audience') {
    window.AudienceQuestions?.desk($('main'), (path, signal) => KEV.api(path, {signal}, KEV.staff.token),
      (path, body, signal) => KEV.api(path, {body, signal}, KEV.staff.token));
    return;
  }
  if (tab === 'messages' || tab === 'attendees') {
    if (!$('participant-tools')) vParticipantWorkspace();
    if (tab === 'messages') updateMessages();
    return;
  }
  if (tab === 'participants') return;
  const stations = DS.stations.map(s => [s.station, s.pair, s.info, s.submitted, s.score, s.ticks_live, s.asked, s.clock.running, s.clock.ended, s.clock.phase, s.clock.round, s.judge, s.seen === null ? null : s.seen < 8]);
  const data = {run: [DS.mode, DS.clock.kind, DS.clock.round, DS.clock.phase, stations, DS.preliminary], scores: [SC?.leaderboard, SC?.flags, summary, DS.preliminary], final: [SC?.final_state, SC?.leaderboard, SC?.final, DS.preliminary], calib: [DS.calib, calib]};
  const sig = tab + JSON.stringify(data[tab]);
  if (!force && sig === lastSig) return;
  if (!force && document.activeElement?.closest('#main') && document.activeElement.matches('input, textarea, select')) return;
  lastSig = sig;
  const restore = KEV.focusedControl($('main'));
  ({run: vRun, scores: vScores, final: vFinal, calib: vCalib})[tab]();
  restore();
}
function vParticipantWorkspace() {
  const messages = tab === 'messages';
  const tools = Object.entries(PARTICIPANT_VIEWS).filter(([, view]) => view[2] === tab);
  $('main').innerHTML = '<nav class="ops-subnav" aria-label="'+(messages ? 'Message tools' : 'Attendee support tools')+'">' +
    tools.map(([key, [label]]) => '<button type="button" class="btn ghost" data-participant-view="'+key+'">'+label+'</button>').join('') +
    '</nav><div id="participant-tools"></div>' + (messages ?
      '<div id="message-composer"><p id="display-status" class="small" role="status"></p>'+messageComposer(true)+'</div><div id="participant-ops-delivery" hidden></div>' :
      '<div id="participant-ops-help" hidden></div>');
  if (messages) bindMessageComposer();
  $('main').querySelectorAll('[data-participant-view]').forEach(button => {
    button.onclick = () => showParticipantView(button.dataset.participantView, true);
  });
  showParticipantView(participantView, false);
}

function showParticipantView(view, updateURL) {
  participantView = view;
  const tools = $('participant-tools');
  tools.hidden = view !== 'updates' && view !== 'nominations';
  tools.dataset.view = view;
  tools.querySelectorAll('[data-participant-panel]').forEach(panel => panel.hidden = panel.dataset.participantPanel !== view);
  if ($('message-composer')) $('message-composer').hidden = view !== 'compose';
  for (const area of ['help','delivery']) {
    const host = $('participant-ops-'+area);
    if (!host) continue;
    host.hidden = area !== view;

// ───────── Run ─────────
function sphase(c) {
  const e = c.elapsed + (c.running ? (Date.now() - recv) / 1000 : 0);
  const ph = e < 600 ? 'Pitch' : e < 780 ? 'Feedback' : e < 900 ? 'Change over' : 'Over time';
  const left = e < 600 ? 600 - e : e < 780 ? 780 - e : e < 900 ? 900 - e : e - 900;
  return {e, ph, txt: KEV.mmss(left) + (e >= 900 ? ' over' : '')};
}
function stxt(s) {
  const sp = sphase(s.clock), idle = !s.clock.started_any && !s.clock.running;
  return idle ? 'Not started' : s.clock.ended ? 'Ended' : (s.clock.running ? '' : 'Paused · ') + sp.ph + ' ' + sp.txt;
}

  }

  const open = id => openControls.has(id) ? ' open' : '';

  }).join('') + '</section>';
  $('main').innerHTML = h;
  $('main').querySelectorAll('[data-r]').forEach(button => button.onclick = () =>
    act('clock', {action:'goto', round:+button.dataset.r, expected_round:c.round}, button));

  } else if (active) {
    h += '<h3>Finalist ' + (f.current + 1) + ' of ' + f.pairs.length + ' · Team ' + currentTeam + '</h3><p><strong>Original scenario:</strong> ' + KEV.esc(f.case_name || f.scenario || '') + '</p>' +
      '<p class="small mut">' + (phase==='ready' ? 'Confirm the host, team and judges are ready, then Start final clock above.' : phase==='pitch' ? 'The team is pitching. At time, judges review and submit their own sheets.' : 'Collect the panel’s sheets and give the team feedback.') + '</p>';
  } else h += '<p>' + (published ? 'The confirmed winners are published on both audience displays. Judge screens are parked.' : 'Confirm all sheets and resolve any remaining ties before publishing the winners.') + '</p>';

      (!f.complete || !f.all_complete ? '<form id="final-override" class="section-tools"><label class="field" for="override-action">Continue with missing sheets<select id="override-action"><option value="next">Next team</option><option value="stop">Review results</option></select></label><label class="field" for="override-reason">Reason for the panel exception<textarea id="override-reason" required minlength="10" maxlength="500"></textarea></label><p class="small mut">This records an exception for missing judges. Their late sheets can still be recovered before publication. Review the consequence before continuing.</p><button class="btn bad">Record exception and continue</button></form>' : '') + '</details></section>';
  }
  if (rows.length) h += '<section class="card table-scroll"><h3>' + (published?'Published results':'Final score review') + '</h3><p class="small mut">' + (published?'Published result snapshot.':'Each judge gives every finalist 1–5 stars. The average determines first, second and third place.') + '</p><table><thead><tr><th>Rank</th><th>Team</th><th>Company</th><th>Scores accepted</th><th>Average / 5</th></tr></thead><tbody>' + rows.map(r=>'<tr><td>'+(r.tie?'Tie':r.rank)+'</td><td>'+r.pair+'</td><td>'+KEV.esc(r.partner)+'</td><td>'+r.judges+' / '+(r.expected||expected)+(r.complete?' ✓':' · Pending')+'</td><td>'+r.final_rating+(r.tie?' · Panel decision needed':'')+'</td></tr>').join('')+'</tbody></table></section>';
  if (phase === 'review') {
    h += '<section class="card"><h3>Confirm and publish</h3>' + (!f.all_complete?'<p class="error">Some teams still need accepted sheets or a recorded panel exception.</p>':'<p>All required sheets are accounted for.</p>') +
      (f.unresolved_ties?.length ? '<form id="final-ties"><p class="error">Unresolved ties: ' + f.unresolved_ties.map(g=>g.map(p=>'Team '+p).join(' / ')).join('; ') + '</p><label class="field" for="tie-order">Panel’s final ranking — all finalist team numbers<input id="tie-order" required value="' + rows.map(r=>r.pair).join(', ') + '"></label><label class="field" for="tie-reason">Panel decision and reason<textarea id="tie-reason" required minlength="10" maxlength="500"></textarea></label><button class="btn alt">Record panel decision</button></form>' : '') +
      '<p>Publishing shows the confirmed podium on Live and the room board and locks the result snapshot.</p><button class="btn" id="fpublish"' + (!f.can_publish?' disabled':'') + '>Publish confirmed winners</button></section>';
  }
  if (published) h += '<details class="card"><summary>Correct a published result</summary><form id="final-reopen"><p>Reopening hides the public podium and returns to review. Judges can recover and resubmit earlier sheets. Publish again only after review.</p><label class="field" for="reopen-reason">Reason for reopening<textarea id="reopen-reason" required minlength="10" maxlength="500"></textarea></label><button class="btn bad">Reopen results for correction</button></form></details>';
  $('main').innerHTML = h;
  if ($('fp')) $('fp').oninput=e=>{finalistDraft=e.target.value;};
  if ($('fset')) $('fset').onclick=e=>act('final',{action:'set',pairs:$('fp').value.split(/[ ,]+/).filter(Boolean).map(Number),panel:[...document.querySelectorAll('[name="final-panel"]:checked')].map(x=>+x.value)},e.currentTarget,()=>{finalistDraft=null;});
  if ($('fgo')) $('fgo').onclick=e=>act('final',{action:'start'},e.currentTarget);
  if ($('fnext')) $('fnext').onclick=e=>act('final',{action:'next'},e.currentTarget);
  if ($('fstop')) $('fstop').onclick=e=>act('final',{action:'stop'},e.currentTarget);
  document.querySelectorAll('[data-fi]').forEach(b=>b.onclick=()=>{if(confirm('Select Team '+f.pairs[+b.dataset.fi]+' and reset its stage clock to paused 8:00?'))act('final',{action:'goto',index:+b.dataset.fi},b);});
  if ($('final-override')) $('final-override').onsubmit=e=>{e.preventDefault();const action=$('override-action').value,reason=$('override-reason').value.trim();if(reason.length<10)return;if(confirm('Record the missing-sheet exception and '+(action==='stop'?'review results':'move to the next team')+'?'))act('final',{action,override_reason:reason},e.submitter);};
  if ($('final-ties')) $('final-ties').onsubmit=e=>{e.preventDefault();act('final',{action:'resolve',order:$('tie-order').value.split(/[ ,]+/).filter(Boolean).map(Number),reason:$('tie-reason').value.trim()},e.submitter);};
  if ($('fpublish')) $('fpublish').onclick=e=>{if(confirm('Publish the confirmed Final winners to the audience now?'))act('final',{action:'publish',confirm:'PUBLISH'},e.currentTarget);};
  if ($('final-reopen')) $('final-reopen').onsubmit=e=>{e.preventDefault();if(confirm('Hide the published winners and reopen score review?'))act('final',{action:'reopen',reason:$('reopen-reason').value.trim()},e.submitter);};
}

// Live View link and preview choices are browser preferences. They are never
// used to decide what a link is authorized to reveal.
const SCENES = {
  info: 'Instructions', prep: 'Prep countdown', pitch: 'Pitch phase',
  scores: 'Scores', final: 'Final', awards: 'Winners', message: 'Message only'
};
const DISPLAY_CHOICES = [
  ['pub', {live: 'Show scores', off: 'Hide scores'}],
  ['rev', {hidden: 'Keep podium hidden', top3: 'Reveal top three', winners: 'Review and publish winners'}]
];
const savedPreview = localStorage.getItem('kevenos:desk:preview');
let previewOpen = savedPreview === null ? dashboard === 'organizer' && typeof matchMedia === 'function' && matchMedia('(min-width: 1050px)').matches : savedPreview === '1';
let presenterNamed = localStorage.getItem('kevenos:desk:show-names') === '1';

function presenterURL(path = '/live', embed = false) {
  const url = new URL(path, location.origin);
  const key = presenterNamed ? DS.view_key : DS.anonymous_view_key;
  if (key) url.searchParams.set('key', key);
  if (!presenterNamed) url.searchParams.set('names', '0');
  if (embed) url.searchParams.set('embed', '1');
  return url.href;
}

function updatePresenter() {
  $('present-open').href = presenterURL();
  $('present-board').href = presenterURL('/board');
  $('present-name-state').textContent = presenterNamed ? 'Names shown' : 'Names hidden';
  $('present-link').value = presenterURL();
  $('present-toggle').setAttribute('aria-expanded', String(previewOpen));
  $('present-toggle').textContent = previewOpen ? 'Close preview' : 'Preview presenter screen';
  const frame = $('present-frame');
  frame.hidden = !previewOpen;
  if (!previewOpen) frame.removeAttribute('src');
  else if (frame.src !== presenterURL('/live', true)) frame.src = presenterURL('/live', true);
}

function choices(kind, values) {
  return Object.entries(values).map(([key, label]) => '<button class="btn ghost sm" data-' + kind + '="' + key + '" aria-pressed="false">' + label + '</button>').join('');
}

function messageComposer(organizer) {
  const fields = [
    {style:'room', title:'Room banner', details:'Show a short instruction on the projector.', form:'room-form',
      status:'room-active-message', input:'droom', label:'Room screen message', send:'droomshow', clear:'droomclear',
      submit:'Show on room screen', remove:'Clear room message'},
    {style:'phones', title:'Phone announcement', details:'Send a time-sensitive announcement to signed-in participants.', form:'announce-form',
      status:'phone-active-message', input:'dann', label:'Participant phone message', send:'dsend', clear:'dclr',
      submit:'Send to phones', remove:'Clear phone message'}
  ];
  const cards = fields.map(field => {
    const input = organizer ? '<textarea id="'+field.input+'" maxlength="200" rows="3" required></textarea>' :
      '<input type="text" id="'+field.input+'" maxlength="200">';
    const phoneOption = field.style === 'phones' ? '<label class="chk"><input type="checkbox" id="dimportant"> Open pop-up on participant phones</label>' : '';
    return '<form id="'+field.form+'" class="room-announcement'+(organizer ? ' card ops-compose-card' : '')+'" data-channel="'+field.style+'">'+
      (organizer ? '<header><h2>'+field.title+'</h2><p>'+field.details+'</p></header>' : '')+
      '<label class="field">'+field.label+input+'</label>'+phoneOption+
      '<div class="row"><button class="btn" id="'+field.send+'">'+field.submit+'</button>'+
      '<button class="btn ghost" type="button" id="'+field.clear+'">'+field.remove+'</button></div>'+
      (organizer ? '<p class="ops-message-status" id="'+field.status+'"></p>' : '')+'</form>';
  }).join('');
  return organizer ? '<div class="ops-compose-grid">'+cards+'</div>' : '<section class="card"><h2>Announcements</h2>'+cards+'</section>';
}

function bindMessageComposer() {
  if (dashboard !== 'organizer') {
    $('dann').value = DS.program.announce || '';
    $('droom').value = DS.program.room_announce ?? DS.program.announce ?? '';
  }
  $('room-form').onsubmit = e => {
    e.preventDefault();
    sendDisplay('program', {action:'announce', channel:'room', text:$('droom').value}, $('droomshow'));
  };
  $('announce-form').onsubmit = e => {
    e.preventDefault();
    sendDisplay('program', {action:'announce', channel:'phones', text:$('dann').value, important:$('dimportant').checked}, $('dsend'));
  };
  $('dclr').onclick = e => sendDisplay('program', {action:'announce', channel:'phones', text:''}, e.currentTarget);
  $('droomclear').onclick = e => sendDisplay('program', {action:'announce', channel:'room', text:''}, e.currentTarget);
}

function updateMessages() {
  const programme = DS.program;
  const room = programme.room_announce ?? programme.announce;
  $('room-active-message').textContent = room ? 'Showing now · '+room : 'No banner showing';

function updateDisplay() {
  const program = DS.program;
  const agenda = DS.agenda;
  const override = program.scene || 'auto';
  const activeStep = agenda[program.i];
  const room = DS.room || {scene:override === 'auto' ? activeStep?.scene : override, title:activeStep?.title};
  const label = {quiz:'Quiz', audience:'Audience question', ...SCENES}[room.scene] || SCENES.info;
  const source = {quiz:'Shown from Quiz', audience:'Shown from Audience questions', manual:'Room override',
    final:'Controlled by Judging Operations', agenda:'Following programme'}[room.source];
  $('display-now').textContent = [label, room.title, source, (program.room_announce ?? program.announce) && 'Room message active'].filter(Boolean).join(' · ');
  const next = agenda[program.i + 1];
  $('display-next').textContent = next ? 'Up next · ' + next.time + ' · ' + next.title : 'Last programme cue';
  if (dashboard === 'organizer') $('ops-cue-title').textContent = activeStep?.title || 'No cue selected';
  $('dnext').disabled = displaySaving || !next;
  $('dprev').disabled = displaySaving || program.i <= 0;
  $('dreturn').disabled = displaySaving || !(room.shares_pending || override !== 'auto');
  $('dclock').checked = program.mode === 'clock';
  const list = $('agenda-steps');
  const agendaSignature = JSON.stringify(agenda);
  if (list.dataset.signature !== agendaSignature) {
    list.dataset.signature = agendaSignature;
    list.innerHTML = agenda.map((item, i) => '<button type="button" class="card" data-set="' + i +
      '"><time class="small">' + KEV.esc(item.time || '') + '</time><b>' + KEV.esc(item.title) +
      '</b>' + (dashboard === 'organizer' ? '<small data-cue-label></small>' : '') + '</button>').join('');
  }
  for (const [key, value] of Object.entries({pub: DS.public, rev: DS.reveal, scene: override, set: String(program.i)})) {
    document.querySelectorAll('[data-' + key + ']').forEach(button => {
      const pressed = button.dataset[key] === value;
      button.classList.toggle(key === 'set' ? 'on' : 'alt', pressed);
      if (key !== 'set') button.classList.toggle('ghost', !pressed);
      button.setAttribute('aria-pressed', String(pressed));
      if (key === 'set' && dashboard === 'organizer') {
        const index = Number(button.dataset.set);
        button.querySelector('[data-cue-label]').textContent = pressed ? 'Current' : index === program.i + 1 ? 'Next' : '';
        if (pressed) button.setAttribute('aria-current','step');
        else button.removeAttribute('aria-current');
      }
    });
  }
  updatePresenter();
}

let displaySaving = false;
async function sendDisplay(path, body, button) {
  if (displaySaving) {
    if (button === $('dclock')) button.checked = DS.program.mode === 'clock';
    return;
  }
  displaySaving = true;
  const origin = tab;
  const status = $('display-status');
  const controls = document.querySelectorAll('[data-pub], [data-rev], [data-scene], [data-set], #dsend, #dclr, #droomshow, #droomclear, #dreturn, #dprev, #dnext, #dclock');
  controls.forEach(control => control.disabled = true);
  status.textContent = 'Updating…';
  try {
    await post('/api/desk/' + path, body);
    if (tab !== origin || !active) return;
    if (!await refresh(true)) throw new Error('Saved. Waiting for the latest display state.');
    if (status.isConnected) status.textContent = origin === 'messages' ?
      (body.text ? (body.channel === 'room' ? 'Room banner is showing.' : 'Phone announcement sent.') : 'Message cleared.') : 'Display updated.';
    if (body.action === 'announce' && status.isConnected) {
      const room = body.channel === 'room';
      $(room ? 'droom' : 'dann').value = origin === 'messages' ? '' : room ? DS.program.room_announce || '' : DS.program.announce || '';
      if (origin === 'messages' && !room) $('dimportant').checked = false;
    }
  } catch (e) {
    if (status.isConnected) status.textContent = e.message;
    if (button === $('dclock')) button.checked = DS.program.mode === 'clock';
  } finally {
    displaySaving = false;
    controls.forEach(control => control.disabled = false);
    if (tab === 'display' && active) updateDisplay();
    if (tab === 'messages' && active) updateMessages();
  }
}

setInterval(refresh, 2000);
setInterval(tickClock, 250);
start();
</script>
</body>
</html>
