name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm}
      - run: pip install -r agent-requirements.txt
      - run: PYTHONPATH=.:tests python -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: ./tools/verify-sanitized.sh
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: kevenos:test}
      - uses: docker/build-push-action@v6
        with: {context: ., file: Dockerfile.website, push: false, tags: kevenos-site:test}
