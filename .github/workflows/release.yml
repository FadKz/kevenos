name: Prepare release artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to prepare, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  qualify-and-draft:
    name: Qualify and prepare candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: docker/setup-buildx-action@v4

      - name: Verify the requested tag exists
        run: git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
      - name: Install dependencies
        run: |
          python -m pip install --requirement agent-requirements.txt
          npm ci
      - name: Run complete qualification suite
        run: |
          PYTHONPATH=.:tests python -m unittest discover -s tests -p 'test_*.py'
          npm run lint
          npm test
          npm audit --audit-level=high
          ./tools/verify-sanitized.sh
          python tools/release.py validate --tag "$RELEASE_TAG"
      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: kevenos:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=application
      - name: Build website image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.website
          push: false
          tags: kevenos-site:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=website
      - name: Prepare deterministic release artifacts
        run: python tools/release.py build --tag "$RELEASE_TAG" --output dist
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kevenos-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Summarize the qualified candidate
        run: |
          {
            echo "### KevenOS ${RELEASE_TAG#v} qualified"
            echo
            echo "The complete release candidate is attached to this workflow run for 90 days."
            echo "After reviewing the checksums and notes, FadKZ can publish it from the GitHub Releases page."
          } >> "$GITHUB_STEP_SUMMARY"
